<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow — Sign in</title><link rel="stylesheet" href="/css/auth.css"></head><body><div class="auth"><div class="brand">FF <b>FocusFlow</b></div><div class="card"><span class="tag">ATTENTION OS</span><h1>Welcome back.</h1><p>Continue building an attention span that works for you.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Enter FocusFlow →</button><div id="msg"></div><a href="/register.html">Create a new account</a<a href="/forgot.html">Forgot password?</a>
    <a href="/dashboard.html">Continue as guest</a></div></div><script>async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok){localStorage.setItem('ff_user',JSON.stringify(d));location='/dashboard.html'}else msg.textContent=d.message||'Login failed'}</script></body></html>
