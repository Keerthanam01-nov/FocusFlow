<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow — Reports</title><link rel="stylesheet" href="/css/dashboard.css"></head><body><main style="max-width:1200px;margin:auto"><div class="topbar" style="padding-top:30px"><div><span class="eyebrow">WELLBEING REPORT</span><h1>Today's report</h1><p class="muted">A transparent report generated from real events.</p></div><a class="ghost" href="/dashboard.html" style="text-decoration:none;padding:10px 14px">← Command Center</a></div><div class="panel glass" style="padding:30px"><h2 id="headline">Loading…</h2><p id="body"></p><div id="events" class="event-list"></div></div></main><script>
const f=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`};
Promise.all([fetch('/api/wellbeing/metrics?clientId=all').then(r=>r.json()),fetch('/api/wellbeing/events?clientId=all').then(r=>r.json())]).then(([m,e])=>{headline.textContent=`You recorded ${f(m.screenTimeSeconds)} of screen activity today.`;body.textContent=`Focus ${f(m.focusSeconds)} · Distraction ${f(m.distractionSeconds)} · Productivity ${m.productivityScore}% · Shorts ${f(m.youtubeShortSeconds)}. ${m.insight}`;events.innerHTML=e.slice(0,25).map(x=>`<div class="event-row"><b>${x.application||x.category||'Activity'}</b><span>${x.title||''}</span><em>${f(x.durationSeconds)}</em></div>`).join('')||'<p class="muted">No events recorded yet.</p>'})
</script></body></html>
