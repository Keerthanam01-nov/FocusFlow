<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow — Analytics</title><link rel="stylesheet" href="/css/dashboard.css"></head><body><main style="max-width:1200px;margin:auto"><div class="topbar" style="padding-top:30px"><div><span class="eyebrow">ATTENTION LAB</span><h1>Analytics</h1><p class="muted">Calculated from your recorded activity events.</p></div><a class="ghost" href="/dashboard.html" style="text-decoration:none;padding:10px 14px">← Command Center</a></div><div id="cards" class="stat-grid"></div><div class="dashboard-grid"><div class="panel glass"><span class="eyebrow">APPLICATIONS</span><h3>Where time went</h3><div id="apps" class="app-list"></div></div><div class="panel glass"><span class="eyebrow">CATEGORIES</span><h3>Attention composition</h3><div id="cats" class="app-list"></div></div></div></main><script>
const f=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`};
fetch('/api/wellbeing/metrics?clientId=all').then(r=>r.json()).then(m=>{cards.innerHTML=[['SCREEN TIME',f(m.screenTimeSeconds)],['FOCUS',f(m.focusSeconds)],['DISTRACTION',f(m.distractionSeconds)],['PRODUCTIVITY',m.productivityScore+'%']].map(x=>`<div class="stat glass"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');const render=(id,a)=>document.getElementById(id).innerHTML=(a||[]).map(x=>`<div class="app-row"><span>${x.name}</span><div class="bar"><i style="width:${Math.min(100,Math.round(x.seconds/Math.max(1,a[0]?.seconds||1)*100))}%"></i></div><em>${f(x.seconds)}</em></div>`).join('')||'<p class="muted">No data yet.</p>';render('apps',m.apps);render('cats',m.categories)})
</script></body></html>
