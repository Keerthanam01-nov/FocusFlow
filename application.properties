spring.application.name=focusflow
server.port=${PORT:8081}

# MySQL (set these environment variables for deployment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/focusflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:FocusFlow@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# FocusFlow
focusflow.youtube.api-key=${YOUTUBE_API_KEY:}
focusflow.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8081}
